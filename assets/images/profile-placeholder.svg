<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="avatar-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="monogram-grad" x1="120" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#avatar-bg)"/>
  
  <!-- Subtle Technical Geometric Accent Rings -->
  <circle cx="200" cy="200" r="180" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="200" cy="200" r="145" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Editorial Monogram AL -->
  <text 
    x="200" 
    y="235" 
    text-anchor="middle" 
    font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="110" 
    font-weight="800" 
    letter-spacing="-4" 
    fill="url(#monogram-grad)">AL</text>
    
  <!-- Subtitle Label -->
  <text 
    x="200" 
    y="275" 
    text-anchor="middle" 
    font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="12" 
    font-weight="600" 
    letter-spacing="5" 
    fill="#94a3b8" 
    opacity="0.75">PHOTO PLACEHOLDER</text>
</svg>

